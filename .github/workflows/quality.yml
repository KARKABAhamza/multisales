name: Code Quality and Security

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  codacy-analysis:
    name: Codacy Analysis (SARIF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Optional: set in repo secrets if you want results uploaded to Codacy
          # Otherwise we produce SARIF and upload to GitHub code scanning
          # project-token is optional; comment it out to avoid invalid secrets access when not set
          # To enable upload to Codacy, create a repository secret named CODACY_PROJECT_TOKEN
          # and uncomment the line below:
          # project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          format: sarif
          output: codacy-results.sarif
          upload: false

      - name: Upload SARIF to GitHub Code Scanning (Codacy)
        uses: github/codeql-action/upload-sarif@4248455a6f2335bc3b7a8a62932f000050ec8f13
        with:
          sarif_file: codacy-results.sarif

  trivy-security:
    name: Trivy Security Scan (deps & filesystem)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@b2933f565dbc598b29947660e66259e3c7bc8561
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Upload SARIF to GitHub Code Scanning (Trivy)
        uses: github/codeql-action/upload-sarif@4248455a6f2335bc3b7a8a62932f000050ec8f13
        with:
          sarif_file: trivy-results.sarif

  flutter-ci:
    name: Flutter Analyze and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
