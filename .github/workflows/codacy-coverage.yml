name: Codacy Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests and generate coverage
        run: |
          # Adjust test command as needed for this repository
          pytest --maxfail=1 --disable-warnings -q --cov=./ --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          set -e
          if [ -z "${CODACY_PROJECT_TOKEN}" ]; then
            echo "\nWarning: CODACY_PROJECT_TOKEN is not set. Skipping Codacy upload.\n"
            exit 0
          fi

          echo "CODACY_PROJECT_TOKEN found; running Codacy coverage upload..."

          # Install Codacy coverage reporter (choose the appropriate tool for your project)
          python -m pip install --upgrade codacy-coverage

          # Run the uploader. If your project needs the CLI instead, replace with the CLI invocation.
          codacy-coverage -r coverage.xml
