name: Flutter CI (Windows with WSL Analysis)

on:
  push:
    branches: [ main, feat/functions-tests ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-analyze:
    runs-on: windows-latest
    env:
      FLUTTER_VERSION: '3.24.0'
      FLUTTER_CHANNEL: 'stable'
      # Ensure CODACY_API_TOKEN and GITHUB_WORKSPACE flow into WSL
      WSLENV: CODACY_API_TOKEN/u:GITHUB_WORKSPACE/p
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}

      - name: Enable Windows long paths
        run: git config --system core.longpaths true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run tests (compact)
        run: flutter test -r compact

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flutter-test-logs
          path: |
            **/test/**
            **/.dart_tool/**

      # --- Codacy Analysis via WSL ---
      - name: Install WSL (Ubuntu)
        uses: Vampire/setup-wsl@c967124712fbb4d64caf62d1ecdf6a2bc33ebea5
        with:
          distribution: Ubuntu-20.04
          update: true

      - name: Install Node.js inside WSL
        shell: pwsh
        run: |
          wsl.exe bash -c "curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -"
          wsl.exe bash -c "sudo apt-get install -y nodejs"

      - name: Run Codacy Analysis (SARIF) via WSL
        shell: pwsh
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          $command = "cd \"$env:GITHUB_WORKSPACE\" && npx @codacy/cli analyze --format sarif --output codacy-results.sarif --fail-on-issues false"
          wsl.exe bash -c $command
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Codacy analysis in WSL exited with code $LASTEXITCODE"
          }

      - name: Upload SARIF to GitHub Code Scanning (Codacy)
        if: always()
        uses: github/codeql-action/upload-sarif@4248455a6f2335bc3b7a8a62932f000050ec8f13
        with:
          sarif_file: codacy-results.sarif

      - name: Upload Codacy SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codacy-results-sarif
          path: codacy-results.sarif
