name: Codacy Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codacy:
    name: Codacy Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Analyze (SARIF)
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          npx @codacy/cli analyze --format sarif --output codacy-results.sarif --fail-on-issues false || true

      - name: Analyze (text)
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          npx @codacy/cli analyze --format text --output codacy-results.txt --fail-on-issues false || true

      - name: Upload Codacy Text Results
        uses: actions/upload-artifact@v4
        with:
          name: codacy-results-text
          path: codacy-results.txt

      - name: Upload Codacy SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codacy-results-sarif
          path: codacy-results.sarif
