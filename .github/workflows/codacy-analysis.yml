name: Codacy Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  codacy:
    name: Codacy Static Analysis
    runs-on: ubuntu-latest
    env:
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required by Codacy CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Codacy CLI
        run: |
          curl -Ls https://coverage.codacy.com/get.sh | bash

      - name: Run Codacy Analysis
        run: |
          codacy-analysis-cli analyze \
            --directory . \
            --verbose \
            --output results.json || true

      - name: Run Codacy Coverage Reporter
        run: |
          # Run the coverage reporter; tolerate failures so CI won't be blocked by reporting issues
          codacy-coverage-reporter report || true

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: codacy-results
          path: results.json
