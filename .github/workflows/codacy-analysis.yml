name: Codacy Analysis

on:
  push:
    branches: [ main, feat/functions-tests ]
  pull_request:
    branches: [ main ]

jobs:
  codacy-cli:
    name: Codacy Analysis (SARIF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI (action)
        uses: codacy/codacy-analysis-cli-action@v4
        with:
          output: results.sarif
          format: sarif
          # Allow running even without PR context
          fail_on_issues: false
          # Analyze the whole repo; Codacy will pick up modified files
          directory: .

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  codacy-cli-remote:
    name: Codacy CLI (publish to Codacy)
    runs-on: ubuntu-latest
    needs: codacy-cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required by Codacy CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Codacy CLI
        run: |
          curl -Ls https://coverage.codacy.com/get.sh | bash

      - name: Run Codacy Analysis
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          codacy-analysis-cli analyze \
            --directory . \
            --verbose \
            --output results.json || true

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: codacy-results
          path: results.json
