name: Codacy Analysis

on:
  push:
    branches: [ main, feat/functions-tests ]
  pull_request:
    branches: [ main ]

jobs:
  codacy:
    name: Codacy Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (required by Codacy CLI)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Codacy CLI
        run: |
          curl -Ls https://coverage.codacy.com/get.sh | bash

      - name: Check Codacy token
        id: codacy-token-check
        run: |
          if [ -z "${{ secrets.CODACY_API_TOKEN }}" ]; then
            echo "::warning title=Codacy token missing::Set CODACY_API_TOKEN in GitHub Secrets to enable Codacy analysis."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codacy Analysis
        if: steps.codacy-token-check.outputs.has_token == 'true'
        env:
          CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
        run: |
          codacy-analysis-cli analyze \
            --directory . \
            --verbose \
            --format sarif \
            --output results.sarif || true

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: codacy-results
          path: results.sarif
