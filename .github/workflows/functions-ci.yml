name: Functions CI

on:
  push:
    branches: [ main ]
    paths:
      - 'functions/**'
  pull_request:
    paths:
      - 'functions/**'

  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-test:
    name: Lint & Test (functions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: functions/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache npm cache
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint --if-present

      - name: Run unit tests (JUnit output)
        run: |
          mkdir -p test-results
          npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functions-test-results
          path: test-results/junit.xml

  codacy-analysis:
    name: Codacy Analysis (after functions tests)
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Analyze repository (SARIF)
        run: |
          if [ -n "${{ secrets.CODACY_API_TOKEN }}" ]; then
            export CODACY_API_TOKEN='${{ secrets.CODACY_API_TOKEN }}'
          fi
          npx @codacy/cli analyze --format sarif --output codacy-results.sarif --fail-on-issues false || true

      - name: Analyze repository (text)
        run: |
          if [ -n "${{ secrets.CODACY_API_TOKEN }}" ]; then
            export CODACY_API_TOKEN='${{ secrets.CODACY_API_TOKEN }}'
          fi
          npx @codacy/cli analyze --format text --output codacy-results.txt --fail-on-issues false || true

      - name: Upload Codacy Text Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codacy-results-text
          path: codacy-results.txt

      - name: Upload Codacy SARIF
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codacy-results-sarif
          path: codacy-results.sarif

  deploy-functions:
    name: Deploy Functions (optional)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install firebase-tools
        run: |
          FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          FIREBASE_PROJECT_ID='${{ secrets.FIREBASE_PROJECT_ID }}'
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            npm install -g firebase-tools@latest
          else
            echo "Skipping firebase-tools install: missing FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID"
          fi

      - name: Configure service account
        run: |
          FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-sa.json
            gcloud_auth() { echo 'service account available'; }
          else
            echo "Skipping service account config: FIREBASE_SERVICE_ACCOUNT not set"
          fi

      - name: Authenticate Firebase CLI
        run: |
          FIREBASE_PROJECT_ID='${{ secrets.FIREBASE_PROJECT_ID }}'
          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            # Use the service account JSON to authenticate firebase-tools
            firebase login:ci --no-localhost || true
            export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-sa.json
          else
            echo "Skipping Firebase auth: FIREBASE_PROJECT_ID not set"
          fi

      - name: Deploy functions
        run: |
          FIREBASE_SERVICE_ACCOUNT='${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          FIREBASE_PROJECT_ID='${{ secrets.FIREBASE_PROJECT_ID }}'
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ] && [ -n "$FIREBASE_PROJECT_ID" ]; then
            cd functions
            npm ci
            # Optional: run smoke tests here
            npx firebase-tools deploy --only functions --project "$FIREBASE_PROJECT_ID" --force
          else
            echo "Skipping deploy: missing FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID"
          fi

      - name: Post-deploy notice
        run: |
          FIREBASE_PROJECT_ID='${{ secrets.FIREBASE_PROJECT_ID }}'
          if [ -n "$FIREBASE_PROJECT_ID" ]; then
            echo "Functions deployed to $FIREBASE_PROJECT_ID"
          else
            echo "No deploy executed"
          fi
