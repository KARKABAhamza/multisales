name: Mobile App CI & Code Quality (Linux)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write

jobs:
  flutter-test-analyze:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

  codacy-analysis:
    name: Codacy Static Analysis
    runs-on: ubuntu-latest
    needs: flutter-test-analyze
    env:
      CODACY_API_TOKEN: ${{ secrets.CODACY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node (Required by Codacy CLI)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 18

      - name: Run Codacy Analysis (SARIF)
        run: |
          npx @codacy/cli analyze --format sarif --output codacy-results.sarif --fail-on-issues false || true

      - name: Run Codacy Analysis (text)
        run: |
          npx @codacy/cli analyze --format text --output codacy-results.txt --fail-on-issues false || true

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@4248455a6f2335bc3b7a8a62932f000050ec8f13
        with:
          sarif_file: codacy-results.sarif

      - name: Upload Codacy Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codacy-analysis-artifacts
          path: |
            codacy-results.sarif
            codacy-results.txt
